name: Build macOS Desktop App

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-pake:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Prepare static app files
        shell: bash
        run: |
          mkdir -p dist/data dist/icons/interface
          cp index.html styles.css app.js dist/
          cp data/raceway-data.js data/ampacity-data.js data/voltage-drop-data.js dist/data/
          cp icons/interface/mdi-*.svg dist/icons/interface/
          cp icons/interface/MDI-LICENSE icons/interface/APACHE-2.0-LICENSE dist/icons/interface/

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Set desktop app version
        shell: bash
        run: |
          version=$(node .github/scripts/desktop-version.js)
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Package macOS app with Pake
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          if [ "$APPLE_SIGNING_IDENTITY" = "-" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity, not ad-hoc signing"
            exit 1
          fi
          pake ./dist --name Wireframe --icon ./icons/brand-icon.svg --multi-arch --app-version "$APP_VERSION"

      - name: Verify macOS signature and notarization
        shell: bash
        run: |
          mountpoint="$RUNNER_TEMP/wireframe-dmg"
          mkdir "$mountpoint"
          hdiutil attach ./Wireframe.dmg -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"; rmdir "$mountpoint"' EXIT
          app="$mountpoint/Wireframe.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo -verify_arch x86_64 arm64 "$app/Contents/MacOS/$executable"
          codesign --verify --deep --strict "$app"
          if ! codesign -d --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'; then
            echo "::error::The app is not signed with a Developer ID Application certificate"
            exit 1
          fi
          xcrun stapler validate "$app"

      - name: Rename macOS app and generate checksum
        shell: bash
        run: |
          asset="wireframe-${GITHUB_REF_NAME#v}-macos-universal.dmg"
          mv Wireframe.dmg "$asset"
          shasum -a 256 "$asset" > Wireframe-macos.sha256

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wireframe-macos-latest
          path: |
            ./wireframe-*-macos-universal.dmg
            ./Wireframe-macos.sha256
          if-no-files-found: error
          retention-days: 90

  publish-release:
    if: github.event_name == 'release'
    needs: build-pake
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS release assets
        uses: actions/download-artifact@v4
        with:
          name: Wireframe-macos-latest
          path: release-assets

      - name: Upload macOS assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" release-assets/wireframe-*-macos-universal.dmg release-assets/Wireframe-macos.sha256
