name: Build macOS Desktop App

on:
  push:
    branches: ["main"]
    paths:
      - "**.js"
      - "**.html"
      - "**.css"
      - ".github/workflows/build-desktop-macos.yml"

jobs:
  build-pake:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare static app files
        shell: bash
        run: |
          mkdir -p dist/data
          cp index.html styles.css app.js dist/
          cp data/raceway-data.js data/ampacity-data.js data/voltage-drop-data.js dist/data/

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Set desktop app version
        shell: bash
        run: |
          version=$(node .github/scripts/desktop-version.js)
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Package macOS app with Pake
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          if [ "$APPLE_SIGNING_IDENTITY" = "-" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity, not ad-hoc signing"
            exit 1
          fi
          pake ./dist --name Wireframe --icon ./icons/brand-icon.svg --app-version "$APP_VERSION"

      - name: Verify macOS signature and notarization
        shell: bash
        run: |
          mountpoint="$RUNNER_TEMP/wireframe-dmg"
          mkdir "$mountpoint"
          hdiutil attach ./Wireframe.dmg -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"; rmdir "$mountpoint"' EXIT
          app="$mountpoint/Wireframe.app"
          codesign --verify --deep --strict "$app"
          if ! codesign -d --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'; then
            echo "::error::The app is not signed with a Developer ID Application certificate"
            exit 1
          fi
          xcrun stapler validate "$app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wireframe-macos-latest
          path: |
            ./Wireframe*
            ./*.dmg
          retention-days: 90
