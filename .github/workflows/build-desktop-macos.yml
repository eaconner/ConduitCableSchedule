name: Build macOS Desktop App

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-desktop:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install desktop dependencies
        run: npm ci --prefix src-tauri

      - name: Set desktop app version
        shell: bash
        run: |
          version=$(node .github/scripts/desktop-version.js)
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Package macOS app with Tauri
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          if [ "$APPLE_SIGNING_IDENTITY" = "-" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity, not ad-hoc signing"
            exit 1
          fi
          src-tauri/node_modules/.bin/tauri build --target universal-apple-darwin --bundles dmg --config "{\"version\":\"$APP_VERSION\"}"
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ]; then
            echo "::error::Expected exactly one macOS DMG"
            exit 1
          fi
          mv "${dmgs[0]}" TruRun.dmg

      - name: Verify macOS signature and notarization
        shell: bash
        run: |
          mountpoint="$RUNNER_TEMP/trurun-dmg"
          mkdir "$mountpoint"
          hdiutil attach ./TruRun.dmg -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"; rmdir "$mountpoint"' EXIT
          app="$mountpoint/TruRun.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch x86_64
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64
          codesign --verify --deep --strict "$app"
          if ! codesign -d --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'; then
            echo "::error::The app is not signed with a Developer ID Application certificate"
            exit 1
          fi
          xcrun stapler validate "$app"

      - name: Rename macOS app and generate checksum
        shell: bash
        run: |
          asset="trurun-${GITHUB_REF_NAME#v}-macos-universal.dmg"
          mv TruRun.dmg "$asset"
          shasum -a 256 "$asset" > "${asset%.dmg}.sha256"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TruRun-macos-latest
          path: |
            ./trurun-*-macos-universal.dmg
            ./trurun-*-macos-universal.sha256
          if-no-files-found: error
          retention-days: 90

  publish-release:
    if: github.event_name == 'release'
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS release assets
        uses: actions/download-artifact@v4
        with:
          name: TruRun-macos-latest
          path: release-assets

      - name: Upload macOS assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" release-assets/trurun-*-macos-universal.dmg release-assets/trurun-*-macos-universal.sha256
