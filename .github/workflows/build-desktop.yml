name: Build Desktop App (Pake)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-pake:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare static app files
        shell: bash
        run: |
          mkdir -p dist
          cp index.html styles.css app.js raceway-data.js ampacity-data.js voltage-drop-data.js dist/

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Package macOS app with Pake
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          if [ "$APPLE_SIGNING_IDENTITY" = "-" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity, not ad-hoc signing"
            exit 1
          fi
          pake ./dist --name Wireframe --icon ./brand-icon.svg

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mountpoint="$RUNNER_TEMP/wireframe-dmg"
          mkdir "$mountpoint"
          hdiutil attach ./Wireframe.dmg -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"; rmdir "$mountpoint"' EXIT
          app="$mountpoint/Wireframe.app"
          codesign --verify --deep --strict "$app"
          if ! codesign -d --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'; then
            echo "::error::The app is not signed with a Developer ID Application certificate"
            exit 1
          fi
          xcrun stapler validate "$app"

      - name: Package Windows portable app with Pake
        if: runner.os == 'Windows'
        shell: bash
        run: pake ./dist --name Wireframe --icon ./brand-icon.svg --keep-binary

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Wireframe-${{ matrix.os }}
          path: |
            ./Wireframe*
            ./*.dmg
          retention-days: 90

      - name: Upload Windows portable executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Wireframe-${{ matrix.os }}
          path: ./Wireframe.exe
          if-no-files-found: error
          retention-days: 90