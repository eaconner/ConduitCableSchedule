name: Build Windows Desktop App

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm ci --prefix src-tauri

      - name: Set desktop app version
        shell: bash
        run: |
          version=$(node .github/scripts/desktop-version.js)
          year=${version%%.*}
          version="$((year % 100)).${version#*.}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Package Windows portable app with Tauri
        shell: bash
        run: src-tauri/node_modules/.bin/tauri build --target x86_64-pc-windows-msvc --no-bundle --config "{\"version\":\"$APP_VERSION\"}"

      # Windows signing is disabled until a trusted certificate is available.
      - name: Archive Windows app and generate checksum
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -creplace '^v', ''
          $asset = "wireframe-$version-windows-x64-portable.zip"
          Copy-Item ./src-tauri/target/x86_64-pc-windows-msvc/release/wireframe.exe ./Wireframe.exe
          Compress-Archive -Path ./Wireframe.exe -DestinationPath $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii Wireframe-windows.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wireframe-windows-latest
          path: |
            ./wireframe-*-windows-x64-portable.zip
            ./Wireframe-windows.sha256
          if-no-files-found: error
          retention-days: 90

  publish-release:
    if: github.event_name == 'release'
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: Wireframe-windows-latest
          path: release-assets

      - name: Upload Windows assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" release-assets/wireframe-*-windows-x64-portable.zip release-assets/Wireframe-windows.sha256
