name: Build Windows Desktop App

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-pake:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare static app files
        shell: bash
        run: |
          mkdir -p dist/data dist/icons/interface
          cp index.html styles.css app.js dist/
          cp data/raceway-data.js data/ampacity-data.js data/voltage-drop-data.js dist/data/
          cp icons/interface/mdi-*.svg dist/icons/interface/
          cp icons/interface/MDI-LICENSE icons/interface/APACHE-2.0-LICENSE dist/icons/interface/

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Set desktop app version
        shell: bash
        run: |
          version=$(node .github/scripts/desktop-version.js)
          year=${version%%.*}
          version="$((year % 100)).${version#*.}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Package Windows portable app with Pake
        shell: bash
        run: pake ./dist --name Wireframe --icon ./icons/brand-icon.svg --targets x64 --keep-binary --app-version "$APP_VERSION"

      # Windows signing is disabled until a trusted certificate is available.
      - name: Archive Windows app and generate checksum
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -creplace '^v', ''
          $asset = "wireframe-$version-windows-x64-portable.zip"
          Compress-Archive -Path ./Wireframe.exe -DestinationPath $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii Wireframe-windows.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wireframe-windows-latest
          path: |
            ./wireframe-*-windows-x64-portable.zip
            ./Wireframe-windows.sha256
          if-no-files-found: error
          retention-days: 90

  publish-release:
    if: github.event_name == 'release'
    needs: build-pake
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: Wireframe-windows-latest
          path: release-assets

      - name: Upload Windows assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" release-assets/wireframe-*-windows-x64-portable.zip release-assets/Wireframe-windows.sha256
