<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fa" />
    <title>Wireframe — Cable & Conduit Schedules</title>
    <link rel="stylesheet" href="styles.css?v=2026.11.16.2" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="app-sidebar">
        <a class="brand" href="#" data-page="dashboard" aria-label="Wireframe home">
          <span class="brand-mark"><span class="mdi mdi-cable-data" aria-hidden="true"></span></span>
          <span class="brand-name">wireframe<span>Engineering Schedules</span></span>
        </a>
        <div class="sidebar-workspace">
          <div class="workspace-label">WORKSPACE</div>
          <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Minimize sidebar" aria-controls="app-sidebar" aria-expanded="true" data-tooltip="Minimize sidebar">
            <span class="mdi mdi-dock-left" aria-hidden="true"></span>
          </button>
        </div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-item active" data-page="dashboard" data-tooltip="Overview"><span class="nav-icon mdi mdi-home-outline" aria-hidden="true"></span>Overview</button>
          <button class="nav-item" data-page="cables" data-tooltip="Cable schedule"><span class="nav-icon mdi mdi-cable-data" aria-hidden="true"></span>Cable Schedule<span class="nav-count" id="cable-nav-count">0</span></button>
          <button class="nav-item" data-page="conduits" data-tooltip="Conduit schedule"><span class="nav-icon mdi mdi-pipe" aria-hidden="true"></span>Conduit Schedule<span class="nav-count" id="conduit-nav-count">0</span></button>
          <button class="nav-item" data-page="voltage-drop" data-tooltip="Voltage drop"><span class="nav-icon mdi mdi-chart-bar" aria-hidden="true"></span>Voltage Drop</button>
          <button class="nav-item" data-page="bom" data-tooltip="Bill of Materials"><span class="nav-icon mdi mdi-clipboard-list-outline" aria-hidden="true"></span>Bill of Materials</button>
        </nav>
        <div class="sidebar-bottom">
          <button class="nav-item settings-link" data-page="settings" data-tooltip="Settings"><span class="nav-icon mdi mdi-tune-variant" aria-hidden="true"></span>Settings</button>
          <div class="sidebar-footer">WIREFRAME <span>·</span> <span id="sidebar-version"></span></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumbs"><span id="breadcrumb-project">New Project</span><span class="crumb-chevron">/</span><strong id="breadcrumb-page">Overview</strong></div>
          <div class="topbar-actions">
            <div class="project-file-actions" aria-label="Project file actions">
              <button class="button button-secondary project-file-action" data-action="new-project" title="New Project"><span class="mdi mdi-plus" aria-hidden="true"></span>New</button>
              <button class="button button-secondary project-file-action" data-action="import-project" title="Open Project"><span class="mdi mdi-folder-open-outline" aria-hidden="true"></span>Open</button>
              <button class="button button-secondary project-file-action" data-action="export-project" title="Save Project"><span class="mdi mdi-content-save-outline" aria-hidden="true"></span>Save</button>
            </div>
            <div class="export-wrap">
              <button class="button button-secondary export-trigger" id="export-trigger" aria-expanded="false"><span class="mdi mdi-download" aria-hidden="true"></span>Export<span class="mdi mdi-chevron-down chevron" aria-hidden="true"></span></button>
              <div class="export-menu" id="export-menu" hidden>
                <button data-action="export-cables">Cable Schedule <span>CSV</span></button>
                <button data-action="export-conduits">Conduit Schedule <span>CSV</span></button>
                <button data-action="export-conduit-cable-csv">Conduit Cable Schedule <span>CSV</span></button>
                <button data-action="print-conduit-cable">Conduit Cable Schedule <span>PRINT</span></button>
                <button data-action="export-voltage-drop">Voltage Drop Report <span>CSV</span></button>
                <button data-action="print-voltage-drop">Voltage Drop Report <span>PRINT</span></button>
                <button data-action="export-bom">Bill of Materials <span>CSV</span></button>
                <button data-action="print-bom">Bill of Materials <span>PRINT</span></button>
                <button data-action="print-master-report">Master Report <span>PRINT</span></button>
              </div>
              <input id="backup-import-input" type="file" accept=".ccs,.json,application/json" hidden>
            </div>
          </div>
        </header>
        <section id="page-content" class="page-content" aria-live="polite"></section>
      </main>
    </div>
    <div id="print-root" aria-hidden="true"></div>
    <div id="modal-root"></div>
    <div id="icon-tooltip" class="icon-tooltip" aria-hidden="true" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="data/raceway-data.js?v=2026.11.16"></script>
    <script src="data/ampacity-data.js?v=2026.11.16"></script>
    <script src="data/voltage-drop-data.js?v=2026.11.16"></script>
    <script src="app.js?v=2026.11.16"></script>
  </body>
</html>
